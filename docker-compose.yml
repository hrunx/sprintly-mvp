services:
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-log-bin
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sprintly
      MYSQL_USER: sprintly
      MYSQL_PASSWORD: sprintly
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  firecrawl:
    image: ghcr.io/mendableai/firecrawl:latest
    environment:
      - PORT=3002
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-local-demo}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISABLE_AUTH=true
    ports:
      - "3002:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:

